name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Chromium only — matches `bun run e2e`. The chart-coverage project is
      # deliberately excluded (see playwright.config.ts): it's a report
      # generator that takes minutes, not a regression test.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Real chart PMTiles are gitignored and absent here, and the chart-load
      # monitor (rightly) raises a failure banner when archives 404 — which
      # can intercept unrelated clicks mid-test. Stub every catalog archive
      # with the tiny committed e2e fixture so the app sees a healthy chart
      # server. (No-op on a dev machine with real tiles built.)
      - name: Stub chart artifacts
        run: bun tools/e2e-stub-charts.ts

      - name: E2E
        run: bun run e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
