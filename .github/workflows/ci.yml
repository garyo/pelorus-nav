name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  # The S-57 pipeline's own suite. Pure Python — shapely and friends, no gdal
  # or tippecanoe — so it needs no system packages, and it runs alongside the
  # jobs above rather than lengthening the run.
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/s57-pipeline
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/s57-pipeline/uv.lock

      - name: Pipeline tests
        run: uv run pytest

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Chromium only — matches `bun run e2e`. The chart-coverage project is
      # deliberately excluded (see playwright.config.ts): it's a report
      # generator that takes minutes, not a regression test.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Real chart PMTiles are gitignored and absent here, and the chart-load
      # monitor (rightly) raises a failure banner when archives 404 — which
      # can intercept unrelated clicks mid-test. Stub every catalog archive
      # with the tiny committed e2e fixture so the app sees a healthy chart
      # server. (No-op on a dev machine with real tiles built.)
      - name: Stub chart artifacts
        run: bun tools/e2e-stub-charts.ts

      - name: E2E
        run: bun run e2e

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Android Lint over the native code: its NewApi check fails the build on a
  # call newer than minSdk, which would crash the app on older Android.
  android-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.12"

      # The Capacitor CLI rejects the runner's Node 20.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # cap sync generates the plugin projects Gradle needs; lint needs no web
      # build, so a placeholder page stands in for one.
      - name: Sync Android
        run: |
          mkdir -p dist
          echo '<!doctype html><title>lint</title>' > dist/index.html
          bunx cap sync android

      - name: Android Lint
        working-directory: android
        run: ./gradlew :app:lintDebug --build-cache
